# Install on the Pi (one-time):
#   sudo mkdir -p /etc/systemd/system.conf.d
#   sudo cp scripts/system-watchdog.conf /etc/systemd/system.conf.d/watchdog.conf
#   sudo cp /boot/firmware/config.txt or /boot/config.txt — ensure line exists:
#     dtparam=watchdog=on
#   sudo systemctl daemon-reexec
#
# If SSH dies but the Pi is still powered, the hardware watchdog should reboot within ~15s
# when the kernel stops scheduling (true lockups). It does not help if only userspace wedged
# while the kernel still runs — use nightly-reboot-at-4am.timer as a backstop.

[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=5min